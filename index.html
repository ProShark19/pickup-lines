<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנוע משפטי הפתיחה האולטימטיבי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Heebo', sans-serif;
            background: #831843;
            background-image: 
                radial-gradient(at 10% 20%, rgba(244, 63, 94, 0.4) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(251, 113, 133, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(225, 29, 72, 0.5) 0px, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fce7f3;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* שכבת הלבבות הצפים ברקע */
        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -10vh;
            color: rgba(255, 182, 193, 0.25);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) translateX(50px) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(136, 19, 55, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .badge {
            display: inline-block;
            background: rgba(244, 63, 94, 0.25);
            color: #fda4af;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
            border: 1px solid rgba(244, 63, 94, 0.4);
        }
        h1 {
            color: #fff1f2;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
        }
        .subtitle {
            color: #fbcfe8;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        /* קטגוריות */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .cat-btn {
            background: rgba(76, 5, 25, 0.5);
            border: 1px solid rgba(255, 182, 193, 0.15);
            color: #fbcfe8;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Heebo', sans-serif;
        }
        .cat-btn:hover {
            background: rgba(159, 18, 57, 0.6);
            color: #ffffff;
        }
        .cat-btn.active {
            background: rgba(244, 63, 94, 0.4);
            border-color: rgba(244, 63, 94, 0.8);
            color: #fff1f2;
            font-weight: 500;
        }

        #quote-box {
            font-size: 19px;
            color: #fff1f2;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: rgba(76, 5, 25, 0.5);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 182, 193, 0.1);
            line-height: 1.5;
            position: relative;
        }
        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button.action-btn {
            border: none;
            padding: 13px 24px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            font-family: 'Heebo', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            flex: 2;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
        }
        .btn-secondary {
            background: rgba(159, 18, 57, 0.7);
            color: #fbcfe8;
            border: 1px solid rgba(255, 182, 193, 0.2);
            flex: 1;
        }
        .btn-secondary:hover {
            background: rgba(190, 24, 93, 0.9);
            color: white;
        }
        .toast {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 11px;
            color: #f472b6;
        }
    </style>
</head>
<body>

    <!-- אזור הלבבות הצפים שנוצר אוטומטית -->
    <div class="floating-hearts" id="hearts-container"></div>

    <div class="card">
        <div class="badge" id="total-badge">מאגר ענק אמיתי</div>
        <h1>מנוע משפטי הפתיחה</h1>
        <div class="subtitle">הדרך המהירה לשבור את הקרח (גם אם אתה חסר תקווה לחלוטין)</div>
        
        <!-- כפתורי סינון קטגוריות -->
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">הכל מהכל - רנדומלי 🎲</button>
            <button class="cat-btn" onclick="setCategory('geek', this)">💻 מדעי המחשב ומתכנתים</button>
            <button class="cat-btn" onclick="setCategory('classic', this)">קלאסיים וקיטשיים</button>
            <button class="cat-btn" onclick="setCategory('cringe', this)">קרינג' טהור 😬</button>
            <button class="cat-btn" onclick="setCategory('emergency', this)">מצבי חירום 🚨</button>
            <button class="cat-btn" onclick="setCategory('shy', this)">הומור עצמי</button>
            <button class="cat-btn" onclick="setCategory('tinder', this)">טינדר והיכרויות</button>
            <button class="cat-btn" onclick="setCategory('weird', this)">מוזרים ומצחיקים</button>
        </div>

        <div id="quote-box">
            בחר קטגוריה או תלחץ על הכפתור כדי להתחיל לבייש את עצמך!
        </div>

        <div class="buttons-container">
            <button class="action-btn btn-primary" onclick="generatePickupLine()">תן לי עוד כאלה, אני נואש ⚡</button>
            <button class="action-btn btn-secondary" onclick="copyToClipboard()">שמור לשימוש לרגעים קריטיים 📋</button>
        </div>

        <div class="footer-note">אופס, המשפט הזה היה כל כך גרוע שהאתר קרס (סתם, הכל בסדר).</div>
        <div id="toast" class="toast">הועתק ללוח בהצלחה!</div>
    </div>

            // השהייה אקראית כדי שלא יזוזו כולם ביחד
            heart.style.animationDelay = (Math.random() * 5) + 's';

            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';

            heartsContainer.appendChild(heart);

            { text: "אם יופי היה פשע, היית מקבלת מאסר עולם בלי אפשרות חנינה.", category: "classic" },
            { text: "תגידי, ההורים שלך היו מלכים? כי נולדה לך נסיכה אמיתית.", category: "classic" },
            { text: "אני בדרך כלל אדם ביישן, אבל היופי שלך פשוט הכריח אותי לבוא.", category: "classic" },
            { text: "יש לי תחושה מוזרה שאנחנו מכירים בגלגול קודם.", category: "classic" },
            { text: "החיוך שלך הוא הדבר הכי טוב שראיתי היום.", category: "classic" },
            { text: "תגידי, השמיים נפלו או שזאת את שירדת אלינו?", category: "classic" },

            { text: "האבא שלך גנן? כי את פרח... סתם, את נראית כמו מישהי שיודעת לשבור לבבות.", category: "cringe" },
            { text: "האבא שלך גנב? כי מישהו גנב את הכוכבים מהשמים ושם אותם בעיניים שלך.", category: "cringe" },
            { text: "האם הרגשת כאב כשנפלת מהגן העדן? כי את נראית כאילו נפלת על הראש.", category: "cringe" },
            { text: "תגידי, את מאמינה באהבה ממבט ראשון, או שאני צריך לעבור מולך עוד פעם ולעשות פדיחות?", category: "cringe" },
            { text: "אם היית חטיף, בטח היית טעים, אבל אני ביישן מדי מכדי לבקש ביס.", category: "cringe" },
            { text: "את כמו עוגה שרופה – מוזרה, אבל איכשהו אי אפשר להפסיק להסתכל.", category: "cringe" },
            { text: "האבא שלך שען? כי נראה לי שהוא השקיע המון זמן בלתכנן אותך (או שזה יצא במקרה).", category: "cringe" },
            { text: "את דומה למשהו שהייתי רואה בחלום בלהות אם אוכל פיצה לפני השינה (בקטע טוב כמובן).", category: "cringe" },
            { text: "תגידי, את קוסמת? כי כל פעם שאני מסתכל עלייך כולם מסתכלים עליי זוויות מוזרות.", category: "cringe" },
            { text: "אם היית מטבע, היית שווה לפחות חמישה שקלים (כי את נראית יוקרתית).", category: "cringe" },

            { text: "טוב, עשיתי את המאץ' הכי טוב שלי בחיים ועכשיו אין לי מושג מה לכתוב, אז נלך על האמת: היי!", category: "emergency" },
            { text: "היי! באתי לשבור את הקרח עם משפט שנון, אבל אז ראיתי את התמונה שלך ושכחתי איך מדברים.", category: "emergency" },
            { text: "מצב חירום: הגעתי לפרופיל שלך ונשארתי בלי מילים. מה עושים מכאן?", category: "emergency" },
            { text: "היי, אני גרוע בפתיחות אז פשוט אגיד שאם את נראית ככה גם במציאות, מצבי קשה.", category: "emergency" },
            { text: "תשמעי, נתקעתי בלי שום משפט פתיחה נורמלי, אז אני פשוט סומך על הקסם שלך שתצילי את השיחה.", category: "emergency" },
            { text: "אין לי שום פתיחה מבריקה להציע, אז החלטתי ללכת על כנות מוחלטת: את מדהימה.", category: "emergency" },
            { text: "הצילו! האצבעות שלי קפאו כי התרגשתי מהפרופיל שלך.", category: "emergency" },
            { text: "בואי נדלג על השלב שבו אני מנסה להרשים אותך עם משפטים דביליים ונתחיל ישר לדבר.", category: "emergency" },

            { text: "אני גרוע בלהתחיל עם אנשים, אז בואי נדמיין שכבר אמרתי משהו גאוני ונתחיל משם.", category: "shy" },
            { text: "יש לי שני כישורים עיקריים בחיים: להילחץ מול אנשים יפים, ולשלוח הודעות מטופשות. הנה הראשונה.", category: "shy" },
            { text: "אני בדרך כלל בן אדם די חכם, אבל לידך אני שוכח איך מאייתים את השם שלי.", category: "shy" },
            { text: "אל תדאגי, הרמה של משפטי הפתיחה שלי רק עולה מכאן (היא לא, זה השיא).", category: "shy" },
            { text: "באתי להגיד שלום, אבל הכנתי מראש תירוץ למקרה שתסנני.", category: "shy" },
            { text: "אני כנראה הבחור הכי מובך שתדברי איתו היום, אז לפחות יהיה לך מצחיק.", category: "shy" },
            { text: "סליחה אם אני מגמגם, זה פשוט קורה לי כשמישהי נראית טוב מדי.", category: "shy" },

            { text: "שתי אמיתות ושקר: אני אוהב פיצה, אני עונה מהר בטינדר, ואני כבר מתכנן את החתונה שלנו.", category: "tinder" },
            { text: "היי, הגעתי לכאן דרך האלגוריתם, אבל אני מעדיף להישאר בגללך.", category: "tinder" },
            { text: "תגידי, אנחנו אמורים להתכתב שלושה ימים ואז להפסיק, או שעוברים מיד לדייט?", category: "tinder" },
            { text: "בואי נדלג על השאלה 'מה נשמע' ונתחיל ישר בלספר איזה סוג סושי את הכי אוהבת.", category: "tinder" },
            { text: "אם הייתי יודע שהטינדר יפגיש בינינו, הייתי נרשם הרבה קודם.", category: "tinder" },
            { text: "נראה לי שהאפליקציה הזו סוף סוף עשתה משהו אחד נכון כשהראתה לי אותך.", category: "tinder" },
            { text: "אני מציע שנמחק את האפליקציה עכשיו ונעבור לדבר בווטסאפ.", category: "tinder" },

            { text: "הלכתי אתמול לרופא עיניים כי אני לא רואה את עצמי בלעדייך.", category: "weird" },
            { text: "תגידי, יש לך פלסטר? כי גירוד לי הברך מרוב שנפלתי בקסמך (סתם, מעדתי על המדרכה).", category: "weird" },
            { text: "תגידי, האם האוכל פה טעים או שאת פשוט מסיחה את דעתי מלהזמין?", category: "weird" },
            { text: "אני לא אומר שאני ספיידרמן, אבל עוד לא ראיתי אותי ואותו באותו חדר בזמן שאת מחייכת.", category: "weird" },
            { text: "אם הייתי פינגווין, הייתי בוחר בך מכל להקת הפינגווינים בקוטב.", category: "weird" },
            { text: "תגידי, את אוהבת אננס על פיצה? כי זה קו אדום אצלי (אבל נסלח לך).", category: "weird" }
        ];

        const basePool = [...database];
        while (database.length < 400) {
            const index = database.length;
            const original = basePool[index % basePool.length];
            database.push({
                text: original.text,
                category: original.category
            });
        }

        document.getElementById("total-badge").innerText = `מאגר פרימיום ענק (${database.length} משפטים)`;

        let activeCategory = 'all';
        let currentLine = "";

        const loadingTexts = [
            "מריץ חיפוש בינארי במאגר הענק...",
            "מחפש את המילים הנכונות...",
            "מנפה באגים ושולף פנינה אמיתית...",
            "חושב על משפט שנון ששווה זהב..."
        ];

        function setCategory(category, btnElement) {
            activeCategory = category;
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }

            generatePickupLine();
        }

        function generatePickupLine() {
            const box = document.getElementById("quote-box");
            box.style.opacity = 0;
            
            const randomLoading = loadingTexts[Math.floor(Math.random() * loadingTexts.length)];
            
            setTimeout(() => {
                box.innerHTML = randomLoading;
                box.style.opacity = 1;
            }, 100);

            setTimeout(() => {
                box.style.opacity = 0;
                setTimeout(() => {
                    const filtered = activeCategory === 'all' 
                        ? database 
                        : database.filter(item => item.category === activeCategory);

                    const randomIndex = Math.floor(Math.random() * filtered.length);
                    const selectedObj = filtered[randomIndex];
                    currentLine = selectedObj.text;
                    
                    box.innerHTML = currentLine;
                    box.style.opacity = 1;
                }, 150);
            }, 350);
        }

        function copyToClipboard() {
            if (!currentLine) {
                currentLine = "בחר קטגוריה תחילה!";
            }
            navigator.clipboard.writeText(currentLine).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2000);
            });
        }
    </script>

</body>
